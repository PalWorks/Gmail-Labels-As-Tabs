name: Deploy to GitHub Pages

# Manual trigger only. Actions minutes are spent deliberately, never on every
# push. Run from the Actions tab ("Deploy to GitHub Pages" -> "Run workflow"),
# or with `gh workflow run deploy.yml --ref main`.
#
# The consequence is real and worth stating: pushing to main changes nothing
# that a visitor sees. The live site only moves when this workflow is run. If
# the privacy policy or any other legal page changes, dispatch this before
# telling anyone the page is updated.
on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'Optional note recorded with this run (for example: 1.5.0 privacy policy)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
