  <!--
    Old links used the hash router: #/privacy, #/changelog, #/contact. The
    Chrome Web Store listing still points at #/privacy. Every page is now a
    real address, and this sends the old form to it before anything else
    loads, so analytics counts one visit rather than two.
  -->
  <script>
    (function () {
      var h = location.hash;
      if (h.indexOf('#/') !== 0) return;
      var p = h.slice(2).split(/[?#]/)[0].replace(/^\/+|\/+$/g, '');
      location.replace('/Gmail-Labels-As-Tabs/' + (p ? p + '/' : ''));
    })();
  </script>
